name: Rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: build and test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - run: cargo build --locked
      - run: cargo test --locked

  aarch64:
    name: build (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
      # No target sysroot on the runner, so build OpenSSL from source, the same way the
      # Dockerfile.*.binary cross-builds do. This edits the runner's checkout only.
      - name: Vendor OpenSSL
        run: |
          sed -i 's|^openssl = { version = "0.10" }|openssl = { version = "0.10", features = ["vendored"] }|' Cargo.toml
          grep -q '^openssl = .*"vendored"' Cargo.toml
      # No --locked here: enabling the vendored feature adds openssl-src to the resolve.
      - run: cargo build --target aarch64-unknown-linux-gnu
